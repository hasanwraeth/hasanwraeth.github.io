# ══════════════════════════════════════════════════════════════════════════════
# HUGO BLOX CONFIGURATION  —  tailored for an industry job-seeker portfolio
# Schema: hugoblox.com/schema/v2
# Tutorial: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
#
# >>> EDIT EVERY "TODO" MARKER BELOW WITH YOUR OWN DETAILS <<<
# ══════════════════════════════════════════════════════════════════════════════
hugoblox:
  schema: "2.0"

  # ────────────────────────────────────────────────────────────────────────────
  # IDENTITY  —  who you are; shown in navbar, footer, browser title, SEO
  # ────────────────────────────────────────────────────────────────────────────
  identity:
    logo: true
    name: "Hasan Al Reza"                          # TODO: your full name
    organization: "Hasan Al Reza"
    type: person                                # person | organization | local_business
    tagline: "Bioinformatics Data Scientist"         # TODO: your target role title
    description: >-                             # TODO: one-liner for search/social
      👨🏾‍💻Computational Biologist | 🧬Molecular Biologist  specializing in interpretable
      machine learning, scalable NGS pipelines, and clinical data analysis.
    social:
      twitter: ""                               # TODO: optional X/Twitter handle (no @)

  # ────────────────────────────────────────────────────────────────────────────
  # THEME  —  colors and visual design
  # ────────────────────────────────────────────────────────────────────────────
  theme:
    mode: dark                                  # light | dark | system (follows OS)
    pack: "default"
    colors:
      primary: ""                               # TODO: e.g. "indigo" or "#6366f1"
      secondary: ""
      neutral: ""
    colors_light: {}
    colors_dark: {}
    surfaces:
      background: ""
      foreground: ""
      header:
        background: ""
        foreground: ""
      footer:
        background: ""
        foreground: ""

  # ────────────────────────────────────────────────────────────────────────────
  # TYPOGRAPHY
  # ────────────────────────────────────────────────────────────────────────────
  typography:
    pack: "developer"

  # ────────────────────────────────────────────────────────────────────────────
  # LAYOUT
  # ────────────────────────────────────────────────────────────────────────────
  layout:
    radius: "md"                                # none | sm | md | lg | full
    spacing: "comfortable"                      # compact | comfortable | spacious
    avatar_shape: circle                        # circle | square | rounded

  # ────────────────────────────────────────────────────────────────────────────
  # HEADER  —  navbar
  # ────────────────────────────────────────────────────────────────────────────
  header:
    enable: true
    style: navbar                               # navbar | navbar-simple | minimal
    sticky: true
    align: center                               # left | center | right
    search: true
    theme_toggle: true
    theme_picker: true
    language_switcher: false                    # set true only if you add i18n content
    cta:
      enable: true                              # TODO: show a "Resume" button in the navbar
      text: "Resume"
      url: "uploads/CV_HAR_F7MD.pdf"

  # ────────────────────────────────────────────────────────────────────────────
  # FOOTER
  # ────────────────────────────────────────────────────────────────────────────
  footer:
    style: minimal                              # minimal | columns | centered
    language_switcher: false
    text: ""

  # ────────────────────────────────────────────────────────────────────────────
  # COPYRIGHT
  # ────────────────────────────────────────────────────────────────────────────
  copyright:
    notice: "© {year} {name}. This work is licensed under {license}"
    license:
      type: cc                                  # cc | custom
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

  # ────────────────────────────────────────────────────────────────────────────
  # SEO
  # ────────────────────────────────────────────────────────────────────────────
  seo:
    title: ""                                   # defaults to identity.name
    location:
      address:
        street: ""
        city: "Memphis"                                # TODO: e.g. "Memphis, TN"
        region: "TN"
        postal_code: ""
        country: "USA"
      coordinates:
        latitude: null
        longitude: null
      phone: ""
    ai:
      allow:
        - /
      disallow: []
      note: "Guidance for AI crawlers - customize to match your public content."
      contact: ""

  # ────────────────────────────────────────────────────────────────────────────
  # CONTENT  —  rendering behavior
  # ────────────────────────────────────────────────────────────────────────────
  content:
    math:
      enable: false                             # set true if you show equations
    toc:
      enable: true
    reading_time:
      enable: true
    citations:
      style: apa                                # apa | mla | chicago | ieee

  # ────────────────────────────────────────────────────────────────────────────
  # SEARCH
  # ────────────────────────────────────────────────────────────────────────────
  search:
    enable: true
    suggestions: []
    quick_actions: []

  # ────────────────────────────────────────────────────────────────────────────
  # COMMENTS  —  off for a portfolio; enable if you want a blog comment section
  # ────────────────────────────────────────────────────────────────────────────
  comments:
    enable: false
    provider: ""                                # giscus | disqus
    giscus:
      repo: ""
      repo_id: ""
      category: ""
      category_id: ""
    disqus:
      shortname: ""

  # ────────────────────────────────────────────────────────────────────────────
  # ANALYTICS  —  add your own ID; leave blank to disable
  # ────────────────────────────────────────────────────────────────────────────
  analytics:
    google:
<<<<<<< HEAD
